spring:
  application:
    name: many

server:
  port: 8080

  spring:
    datasource:
      url: jdbc:postgresql://aws-1-ca-central-1.pooler.supabase.com:6543/routinecontroller
      username: ${DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect