
spring:
  application:
    name: many

  datasource:
    url: jdbc:postgresql://aws-1-ca-central-1.pooler.supabase.com:6543/routinecontroller
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
