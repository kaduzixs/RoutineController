
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Tracker | Acesso</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #090909;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 16px;
            box-shadow: 0 15px 50px #0008;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
        }

        h1 span {
            color: #ef4444;
        }

        .subtitle {
            margin-bottom: 25px;
            text-align: center;
            color: #aaa;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tabs button {
            flex: 1;
            background: #252525;
            color: #ccc;
        }

        .tabs button.active {
            background: #dc2626;
            color: white;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #393939;
            border-radius: 8px;
            outline: none;
            background: #202020;
            color: white;
        }

        input:focus {
            border-color: #ef4444;
        }

        button {
            padding: 13px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .submit {
            width: 100%;
            margin-top: 24px;
            background: #dc2626;
            color: white;
        }

        button:hover {
            filter: brightness(1.15);
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>SLEEP <span>TRACKER</span></h1>
    <p class="subtitle">Sua rotina começa aqui.</p>

    <div class="tabs">
        <button type="button" id="loginTab" class="active"
                onclick="showForm('login')">Login</button>

        <button type="button" id="registerTab"
                onclick="showForm('register')">Registro</button>
    </div>

    <form id="authForm">
        <label for="email">E-mail</label>
        <input id="email" type="email"
               placeholder="seu@email.com" required>

        <label for="password">Senha</label>
        <input id="password" type="password"
               placeholder="Digite sua senha"
               minlength="6" required>

        <div id="confirmGroup" class="hidden">
            <label for="confirmPassword">Confirmar senha</label>
            <input id="confirmPassword" type="password"
                   placeholder="Digite a senha novamente"
                   minlength="6">
        </div>

        <button class="submit" id="submitButton" type="submit">
            Entrar na minha conta
        </button>
    </form>

    <div id="message" role="status"></div>
</div>

<script>
    let mode = "login";

    const form = document.getElementById("authForm");
    const message = document.getElementById("message");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const confirmGroup = document.getElementById("confirmGroup");
    const submitButton = document.getElementById("submitButton");

    function showForm(selectedMode) {
        mode = selectedMode;

        document.getElementById("loginTab")
            .classList.toggle("active", mode === "login");

        document.getElementById("registerTab")
            .classList.toggle("active", mode === "register");

        confirmGroup.classList.toggle("hidden", mode === "login");
        confirmPassword.required = mode === "register";

        submitButton.textContent = mode === "login"
            ? "Entrar na minha conta"
            : "Criar minha conta";

        message.textContent = "";
        message.style.color = "#aaa";
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const senha = password.value;

        if (mode === "register" && senha !== confirmPassword.value) {
            message.style.color = "#ff6b6b";
            message.textContent = "As senhas não são iguais.";
            return;
        }

        const endpoint = mode === "login"
            ? "/api/user/login"
            : "/api/user/register";

        submitButton.disabled = true;
        message.style.color = "#aaa";
        message.textContent = "Aguarde...";

        try {
            const response = await fetch(endpoint, {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded;charset=UTF-8"
                },
                body: new URLSearchParams({
                    email: email,
                    password: senha
                })
            });

            const result = await response.text();

            if (!response.ok) {
                throw new Error(result || "Não foi possível realizar a operação.");
            }

            if (mode === "register") {
                message.style.color = "#4ade80";
                message.textContent =
                    "Cadastro realizado! Agora entre na sua conta.";

                form.reset();
                showForm("login");
                message.style.color = "#4ade80";
                message.textContent =
                    "Cadastro realizado! Entre com seu e-mail e senha.";
            } else {
                message.style.color = "#4ade80";
                message.textContent = "Login realizado! Abrindo seu Sleep Tracker...";

                // Mantém a sessão criada pelo backend e abre a página existente.
                window.location.assign("/sleepTracker.html");
            }

        } catch (error) {
            message.style.color = "#ff6b6b";
            message.textContent = error.message ||
                "Erro de conexão com o servidor.";
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
