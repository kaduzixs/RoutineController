
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pegasus | Acesso</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #ffffff;
            color: #111111;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: #ffffff;
            border: 1px solid #d4af37;
            border-radius: 16px;
            box-shadow: 0 15px 50px #0002;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
        }

        h1 span {
            color: #b8860b;
        }

        .subtitle {
            margin-bottom: 25px;
            text-align: center;
            color: #666666;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tabs button {
            flex: 1;
            background: #f3f3f3;
            color: #333333;
        }

        .tabs button.active {
            background: #d4af37;
            color: #111111;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            color: #333333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6d6d6;
            border-radius: 8px;
            outline: none;
            background: #ffffff;
            color: #111111;
        }

        input:focus {
            border-color: #b8860b;
        }

        button {
            padding: 13px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .submit {
            width: 100%;
            margin-top: 24px;
            background: #d4af37;
            color: #111111;
        }

        button:hover {
            filter: brightness(1.15);
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .hidden {
            display: none;
        }

        /* Pegasus: tema preto com detalhes dourados */
        body { background:#050505 !important; color:#f5f5f5 !important; }
        .container { background:#101010 !important; border-color:#3a3016 !important; box-shadow:0 15px 50px #000a !important; }
        h1 span { color:#d4af37 !important; }
        .subtitle { color:#a3a3a3 !important; }
        .tabs button { background:#1b1b1b !important; color:#ddd !important; }
        .tabs button.active, .submit { background:#d4af37 !important; color:#111 !important; }
        label { color:#ddd !important; }
        input { background:#171717 !important; color:#f5f5f5 !important; border-color:#383838 !important; }
        input:focus { border-color:#d4af37 !important; }
        button:hover { filter:brightness(1.08); }
        /* Acabamento visual Pegasus */
        body{position:relative;overflow-x:hidden;background:radial-gradient(ellipse at 50% 0%,#201a0b 0%,#080808 48%,#030303 100%) !important;font-family:Inter,Arial,sans-serif}
        body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:0;border:1px solid rgba(212,175,55,.16);border-radius:50%;transform:rotate(-28deg)}
        body:before{width:520px;height:760px;left:-330px;top:-180px;box-shadow:0 0 0 22px rgba(212,175,55,.025),0 0 0 45px rgba(212,175,55,.018)}
        body:after{width:420px;height:700px;right:-300px;bottom:-220px;box-shadow:0 0 0 22px rgba(212,175,55,.025)}
        .container{position:relative;z-index:1;max-width:460px;padding:36px 34px 32px;background:linear-gradient(145deg,rgba(20,20,20,.98),rgba(7,7,7,.98)) !important;border:1px solid rgba(212,175,55,.42) !important;border-radius:24px;box-shadow:0 25px 90px #000,0 0 45px rgba(212,175,55,.07) !important}
        .brand-mark{display:flex;justify-content:center;align-items:center;margin:0 auto 8px;width:94px;height:82px;color:#e4bf53;filter:drop-shadow(0 6px 18px rgba(212,175,55,.18))}
        .brand-mark svg{width:100%;height:100%}
        h1{font-family:Georgia,'Times New Roman',serif;font-size:34px;letter-spacing:8px;color:#f3d77f;text-shadow:0 2px 24px rgba(212,175,55,.12);margin-bottom:10px}
        .subtitle{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#a8a8a8 !important;margin-bottom:30px}
        .tabs{padding:5px;border:1px solid #302817;border-radius:12px;background:#090909;gap:5px}
        .tabs button{background:transparent !important;color:#bdbdbd !important;transition:all .2s}
        .tabs button.active{background:linear-gradient(135deg,#f3d77f,#c49a2e) !important;color:#090909 !important;box-shadow:0 4px 18px rgba(212,175,55,.15)}
        label{font-size:13px;font-weight:600;color:#e5e5e5 !important}
        input{padding:15px 14px;border-radius:11px;background:#0b0b0b !important;border-color:#343434 !important;transition:border .2s,box-shadow .2s}
        input:focus{border-color:#d4af37 !important;box-shadow:0 0 0 3px rgba(212,175,55,.1)}
        .submit{min-height:51px;margin-top:27px;border-radius:11px;background:linear-gradient(135deg,#f4d77e,#c49a2e) !important;box-shadow:0 8px 24px rgba(212,175,55,.12);transition:transform .2s,box-shadow .2s}
        .submit:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(212,175,55,.2)}
        #message{line-height:1.5}
        @media(max-width:480px){.container{padding:28px 22px}.brand-mark{width:80px;height:70px}h1{font-size:28px;letter-spacing:6px}.subtitle{font-size:10px;letter-spacing:1.5px}}


        /* Acessibilidade: foco visível, temas e opções responsivas no login. */
        :focus-visible{outline:3px solid #56B4E9!important;outline-offset:3px}
        .login-accessibility{margin:0 0 20px;padding:12px;border:1px solid #65552a;border-radius:12px;color:#eee;background:#0b0b0b;font-size:13px}
        .login-accessibility strong{display:block;margin-bottom:8px}.login-access-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px}
        .login-accessibility button,.login-accessibility select{min-height:38px;padding:7px 9px;border:1px solid #777;border-radius:7px;background:#202020;color:#fff}
        .login-accessibility button{cursor:pointer}.login-accessibility label{margin:0;font-size:12px}.login-accessibility select{max-width:100%}
        /* Navbar compacta do login: o botão abre o menu de acessibilidade. */
        .login-navbar{display:flex;justify-content:center;margin:0 0 12px}
        .login-nav-button{min-height:40px;padding:9px 16px;border:1px solid #65552a;border-radius:9px;background:#17130a;color:#f4d77e;font:inherit;font-weight:700;cursor:pointer}
        .login-nav-button:hover{background:#2a220f}
        #loginAccessStatus{display:block;margin-top:6px;font-size:12px}
        body.login-light{background:#f4f5f7!important;color:#171717!important}
        body.login-light .container{background:#fff!important;color:#171717!important;border-color:#999!important}
        body.login-light h1,body.login-light label{color:#171717!important}body.login-light .subtitle{color:#444!important}
        body.login-light input{background:#fff!important;color:#111!important;border-color:#888!important}
        body.login-light .login-accessibility{background:#f4f4f4!important;color:#171717!important;border-color:#888!important}
        body.login-light .login-accessibility button,body.login-light .login-accessibility select{background:#fff!important;color:#111!important}
        body.login-night{background:#020611!important}body.login-night .container,body.login-night .login-accessibility{background:#070d1b!important;border-color:#456080!important}
        body.login-night input,body.login-night .login-accessibility button,body.login-night .login-accessibility select{background:#0c1628!important;color:#f3f6ff!important;border-color:#456080!important}
        body.login-protanopia .submit{background:#0072B2!important;color:#fff!important}body.login-tritanopia .submit{background:#D55E00!important;color:#fff!important}
        body.login-high-contrast .submit{background:#ff0!important;color:#000!important}
        body.login-text-large{font-size:1.12rem}body.login-text-larger{font-size:1.25rem}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}

    </style>
</head>

<body>
<div class="container">
    <div class="brand-mark" aria-label="Símbolo Pegasus" role="img">
        <svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">
            <path d="M17 58C31 51 38 39 40 18C52 29 61 43 60 58C71 48 78 34 77 16C93 32 99 49 91 65C85 78 72 84 61 87C68 77 70 68 67 59C57 71 45 81 29 85C36 75 37 67 34 61C29 65 23 67 17 68" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M63 60C70 48 80 39 93 37L105 44L97 49L94 61L86 69L82 83L74 83L76 69L68 69" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M83 37L89 28L96 35M96 35L105 33M42 27L27 12M51 40L31 30M57 51L37 47" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="94" cy="43" r="1.8" fill="currentColor"/>
        </svg>
    </div>
    <h1>PEGASUS</h1>
    <p class="subtitle">Sua rotina começa aqui.</p>

    <div class="tabs">
        <button type="button" id="loginTab" class="active"
                data-auth-mode="login">Login</button>

        <button type="button" id="registerTab"
                data-auth-mode="register">Cadastro</button>
    </div>

    <!-- Barra de navegação com acesso ao menu de acessibilidade. -->
    <nav class="login-navbar" aria-label="Navegação de ferramentas">
      <button type="button" class="login-nav-button" id="toggleLoginAccessibility" aria-controls="loginAccessibilityPanel" aria-expanded="false">Acessibilidade ⚙</button>
    </nav>

    <!-- Acessibilidade: menu fechado inicialmente; pode ser aberto pela navbar. -->
    <section class="login-accessibility" id="loginAccessibilityPanel" aria-label="Configurações de acessibilidade" hidden>
      <strong>Acessibilidade</strong>
      <div class="login-access-row"><button type="button" id="loginTextSmaller" aria-label="Diminuir texto">A−</button><button type="button" id="loginTextLarger" aria-label="Aumentar texto">A+</button><label for="loginTheme">Tema</label><select id="loginTheme"><option value="dark">Escuro</option><option value="light">Claro</option><option value="night">Noturno</option></select></div>
      <label for="loginVision">Paleta de cores</label><select id="loginVision"><option value="default">Padrão</option><option value="protanopia">Protanopia / deuteranopia</option><option value="tritanopia">Tritanopia</option><option value="high-contrast">Alto contraste</option></select>
      <span id="loginAccessStatus" role="status" aria-live="polite"></span>
    </section>

    <form id="authForm">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254"
               placeholder="seu@email.com" required>

        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128"
               placeholder="Digite sua senha"
               minlength="6" required>

        <div id="confirmGroup" class="hidden">
            <label for="confirmPassword">Confirmar senha</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" maxlength="128"
                   placeholder="Digite a senha novamente"
                   minlength="6">
        </div>

        <button class="submit" id="submitButton" type="submit">
            Entrar na minha conta
        </button>
    </form>

    <div id="message" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

<script>
    let mode = "login";

    const form = document.getElementById("authForm");
    const message = document.getElementById("message");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const confirmGroup = document.getElementById("confirmGroup");
    const submitButton = document.getElementById("submitButton");

    function showForm(selectedMode) {
        // Segurança: só permite os dois modos previstos pela interface.
        if (selectedMode !== "login" && selectedMode !== "register") return;
        mode = selectedMode;

        document.getElementById("loginTab")
            .classList.toggle("active", mode === "login");

        document.getElementById("registerTab")
            .classList.toggle("active", mode === "register");

        confirmGroup.classList.toggle("hidden", mode === "login");
        confirmPassword.required = mode === "register";

        submitButton.textContent = mode === "login"
            ? "Entrar na minha conta"
            : "Criar minha conta";

        message.textContent = "";
        message.style.color = "#aaa";
    }

    // Segurança: os botões usam listeners em vez de handlers inline.
    document.querySelectorAll("[data-auth-mode]").forEach(button => button.addEventListener("click", () => showForm(button.dataset.authMode)));
    // Acessibilidade: configurações sincronizadas com a página principal.
    const loginDefaults={theme:"dark",vision:"default",size:"normal"};
    function readLoginA11y(){
      try{const s=JSON.parse(localStorage.getItem("pegasusAccessibility")||"{}");return{
        theme:["dark","light","night"].includes(s.theme)?s.theme:"dark",
        vision:["default","protanopia","tritanopia","high-contrast"].includes(s.vision)?s.vision:"default",
        size:["normal","large","larger"].includes(s.textSize)?s.textSize:"normal"};}catch(_){return {...loginDefaults};}
    }
    let loginA11y=readLoginA11y();
    function applyLoginA11y(announce=false){
      document.body.classList.remove("login-light","login-night","login-protanopia","login-tritanopia","login-high-contrast","login-text-large","login-text-larger");
      if(loginA11y.theme==="light")document.body.classList.add("login-light");
      if(loginA11y.theme==="night")document.body.classList.add("login-night");
      if(loginA11y.vision!=="default")document.body.classList.add("login-"+loginA11y.vision);
      if(loginA11y.size==="large")document.body.classList.add("login-text-large");
      if(loginA11y.size==="larger")document.body.classList.add("login-text-larger");
      document.getElementById("loginTheme").value=loginA11y.theme;document.getElementById("loginVision").value=loginA11y.vision;
      try{localStorage.setItem("pegasusAccessibility",JSON.stringify({theme:loginA11y.theme,vision:loginA11y.vision,textSize:loginA11y.size}));}catch(_){/* Armazenamento local é opcional. */}
      if(announce)document.getElementById("loginAccessStatus").textContent="Preferências atualizadas.";
    }
    // Controla abrir/fechar do menu sem handlers inline.
    const loginAccessibilityPanel = document.getElementById("loginAccessibilityPanel");
    const toggleLoginAccessibility = document.getElementById("toggleLoginAccessibility");
    toggleLoginAccessibility.addEventListener("click", () => {
      const willOpen = loginAccessibilityPanel.hidden;
      loginAccessibilityPanel.hidden = !willOpen;
      toggleLoginAccessibility.setAttribute("aria-expanded", String(willOpen));
      if (willOpen) loginAccessibilityPanel.querySelector("button, select")?.focus();
    });
    document.getElementById("loginTheme").addEventListener("change",e=>{loginA11y.theme=e.target.value;applyLoginA11y(true);});
    document.getElementById("loginVision").addEventListener("change",e=>{loginA11y.vision=e.target.value;applyLoginA11y(true);});
    document.getElementById("loginTextSmaller").addEventListener("click",()=>{loginA11y.size=loginA11y.size==="larger"?"large":"normal";applyLoginA11y(true);});
    document.getElementById("loginTextLarger").addEventListener("click",()=>{loginA11y.size=loginA11y.size==="normal"?"large":"larger";applyLoginA11y(true);});
    applyLoginA11y();

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const senha = password.value;
        // Validação client-side para usabilidade; nunca substitui a validação no servidor.
        if (email.length > 254 || senha.length < 6 || senha.length > 128) {
            message.style.color = "#ff6b6b";
            message.textContent = "Confira o e-mail e a senha informados.";
            return;
        }

        if (mode === "register" && senha !== confirmPassword.value) {
            message.style.color = "#ff6b6b";
            message.textContent = "As senhas não são iguais.";
            return;
        }

        const endpoint = mode === "login"
            ? "/api/user/login"
            : "/api/user/register";

        submitButton.disabled = true;
        message.style.color = "#aaa";
        message.textContent = "Aguarde...";

        try {
            const response = await fetch(endpoint, {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded;charset=UTF-8"
                },
                body: new URLSearchParams({
                    email: email,
                    password: senha
                })
            });

            // Não exibe o corpo bruto da resposta, que pode revelar detalhes internos.
            if (!response.ok) throw new Error(mode === "login"
                ? "Não foi possível entrar. Confira seus dados e tente novamente."
                : "Não foi possível concluir o cadastro. Confira os dados e tente novamente.");
            await response.text();

            if (mode === "register") {
                message.style.color = "#4ade80";
                message.textContent =
                    "Cadastro realizado! Agora entre na sua conta.";

                form.reset();
                showForm("login");
                message.style.color = "#4ade80";
                message.textContent =
                    "Cadastro realizado! Entre com seu e-mail e senha.";
            } else {
                message.style.color = "#4ade80";
                message.textContent = "Login realizado! Abrindo seu Pegasus...";

                // Mantém a sessão criada pelo backend e abre a página existente.
                window.location.assign("/sleepTracker.html");
            }

        } catch (_) {
            message.style.color = "#ff6b6b";
            message.textContent = "Não foi possível conectar ou concluir a operação. Tente novamente.";
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
