<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sleep Tracker</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                    radial-gradient(circle at top left, #243b55, transparent 40%),
                    radial-gradient(circle at bottom right, #141e30, transparent 45%),
                    #090d14;

            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: rgba(20, 25, 35, 0.92);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 24px;

            padding: 35px;

            box-shadow:
                    0 25px 70px rgba(0, 0, 0, 0.5);

            backdrop-filter: blur(12px);
        }

        .icone {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #4f8cff;

            font-size: 30px;

            box-shadow:
                    0 0 30px rgba(79, 140, 255, 0.35);
        }

        h1 {
            text-align: center;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;

            color: #9ca3af;

            margin-bottom: 30px;
        }

        .secao {
            margin-bottom: 24px;
        }

        .secao-titulo {
            font-size: 14px;

            color: #9ca3af;

            margin-bottom: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .linha {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .campo {
            display: flex;

            flex-direction: column;

            gap: 7px;
        }

        label {
            font-size: 14px;

            color: #d1d5db;
        }

        input {
            width: 100%;

            padding: 14px;

            border-radius: 12px;

            border: 1px solid #343b49;

            background: #111722;

            color: white;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #4f8cff;

            box-shadow:
                    0 0 0 3px rgba(79, 140, 255, 0.12);
        }

        input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        button {
            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 13px;

            background: linear-gradient(
                    135deg,
                    #4f8cff,
                    #6c5ce7
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                    0 10px 25px rgba(79, 140, 255, 0.2);
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                    0 14px 30px rgba(79, 140, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .resultado {
            margin-top: 25px;

            padding: 22px;

            border-radius: 16px;

            background: #111722;

            border: 1px solid #293140;

            animation: aparecer 0.3s ease;
        }

        .resultado h2 {
            margin-bottom: 15px;

            font-size: 18px;
        }

        .resultado-item {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 14px 0;

            border-bottom: 1px solid #293140;
        }

        .resultado-item:last-child {
            border-bottom: none;
        }

        .resultado-item span {
            color: #9ca3af;
        }

        .resultado-item strong {
            font-size: 17px;
        }

        #qualidade {
            color: #4f8cff;
        }

        .erro {
            margin-top: 15px;

            padding: 12px;

            border-radius: 10px;

            background: rgba(255, 92, 92, 0.1);

            color: #ff6b6b;

            text-align: center;

            font-size: 14px;
        }

        .escondido {
            display: none;
        }

        .rodape {
            text-align: center;

            color: #666f7d;

            font-size: 12px;

            margin-top: 22px;
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @media (max-width: 500px) {

            .card {
                padding: 25px;
            }

            .linha {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 26px;
            }

        }

    </style>
</head>


<body>

<div class="container">

    <div class="card">

        <div class="icone">
            🌙
        </div>

        <h1>Sleep Tracker</h1>

        <p class="subtitulo">
            Calcule sua duração de sono
        </p>


        <div class="secao">

            <div class="secao-titulo">
                Horário que dormiu
            </div>

            <div class="linha">

                <div class="campo">

                    <label for="dataSleep">
                        Data
                    </label>

                    <input
                            type="date"
                            id="dataSleep"
                    >

                </div>


                <div class="campo">

                    <label for="horaSleep">
                        Horário
                    </label>

                    <input
                            type="time"
                            id="horaSleep"
                            min="00:00"
                            max="23:59"
                            step="60"
                    >

                </div>

            </div>

        </div>


        <div class="secao">

            <div class="secao-titulo">
                Horário que acordou
            </div>

            <div class="linha">

                <div class="campo">

                    <label for="dataWake">
                        Data
                    </label>

                    <input
                            type="date"
                            id="dataWake"
                    >

                </div>


                <div class="campo">

                    <label for="horaWake">
                        Horário
                    </label>

                    <input
                            type="time"
                            id="horaWake"
                            min="00:00"
                            max="23:59"
                            step="60"
                    >

                </div>

            </div>

        </div>


        <button onclick="calcularSono()">
            Calcular meu sono
        </button>


        <div
                id="resultado"
                class="resultado escondido"
        >

            <h2>🌙 Resultado</h2>


            <div class="resultado-item">

                <span>
                    Duração
                </span>

                <strong id="duracao">
                    -
                </strong>

            </div>


            <div class="resultado-item">

                <span>
                    Qualidade
                </span>

                <strong id="qualidade">
                    -
                </strong>

            </div>

        </div>


        <p
                id="erro"
                class="erro escondido"
        ></p>


        <div class="rodape">
            Sleep Tracker • Spring Boot
        </div>

    </div>

</div>


<script>

    async function calcularSono() {

        const dataSleep =
            document.getElementById("dataSleep").value;

        const horaSleep =
            document.getElementById("horaSleep").value;

        const dataWake =
            document.getElementById("dataWake").value;

        const horaWake =
            document.getElementById("horaWake").value;


        const resultado =
            document.getElementById("resultado");

        const erro =
            document.getElementById("erro");


        resultado.classList.add("escondido");

        erro.classList.add("escondido");

        erro.textContent = "";


        if (
            !dataSleep ||
            !horaSleep ||
            !dataWake ||
            !horaWake
        ) {

            mostrarErro(
                "Preencha todos os campos."
            );

            return;
        }


        const dados = {

            hourSleep:
                `${dataSleep}T${horaSleep}:00`,

            hourWake:
                `${dataWake}T${horaWake}:00`

        };


        try {

            const resposta = await fetch(
                "http://localhost:8080/user/sleep",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify(dados)
                }
            );


            if (!resposta.ok) {

                throw new Error(
                    "Não foi possível conectar ao servidor."
                );

            }


            const duration =
                await resposta.json();


            const segundos =
                duration.seconds;


            const horas =
                Math.floor(segundos / 3600);


            const minutos =
                Math.floor(
                    (segundos % 3600) / 60
                );


            document.getElementById("duracao")
                .textContent =
                `${horas}h ${minutos}min`;


            let qualidade;


            if (horas >= 0 && horas <= 3) {

                qualidade = "RUIM";

            }

            else if (horas > 3 && horas <= 7) {

                qualidade = "MEDIO";

            }

            else if (horas >= 8 && horas <= 10) {

                qualidade = "BOM";

            }

            else {

                qualidade = "MARAVILHOSO";

            }


            document.getElementById("qualidade")
                .textContent =
                qualidade;


            resultado.classList.remove(
                "escondido"
            );


        } catch (error) {

            mostrarErro(error.message);

        }

    }


    function mostrarErro(mensagem) {

        const erro =
            document.getElementById("erro");

        erro.textContent = mensagem;

        erro.classList.remove("escondido");

    }

</script>

</body>

</html>
